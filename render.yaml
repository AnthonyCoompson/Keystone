databases:
  - name: keystone-db
    plan: free
    databaseName: keystone
    user: keystone

services:
  - type: web
    name: keystone-policy-diagnostic
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: keystone-db
          property: connectionString
